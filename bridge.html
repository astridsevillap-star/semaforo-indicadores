<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores · Nogasa</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1c2b4a}
  body{display:grid;place-items:center}
  .loading{font-size:14px;color:#6b7688}
</style>
</head>
<body>
<div class="loading" id="loading">Abriendo tablero de Indicadores…</div>
<script>
(async function(){
  try{
    const response = await fetch('/index.html?public=1', { cache:'no-store' });
    if(!response.ok) throw new Error('No se pudo cargar el tablero (' + response.status + ')');

    let html = await response.text();

    const originalStart = `(async function start(){\n  const { data: authData } = await supabase.auth.getUser();\n  if(!authData.user) return;\n  document.getElementById('auth-gate').style.display = 'none';\n  startDashboard();\n})();`;

    const directStart = `(async function start(){\n  document.getElementById('auth-gate').style.display = 'none';\n  await startDashboard();\n})();`;

    if(!html.includes(originalStart)){
      throw new Error('No se encontró el bloque de inicio del tablero.');
    }

    html = html.replace(originalStart, directStart);
    html = html.replace('<head>', '<head>\n<base href="/">\n<style>#auth-gate{display:none!important}</style>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById('loading').textContent = 'No se pudo abrir el tablero. Actualiza la página e inténtalo nuevamente.';
  }
})();
</script>
</body>
</html>
