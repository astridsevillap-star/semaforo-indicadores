<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores · Nogasa</title>
<style>
  :root{--navy:#1c2b4a;--red:#c0392b;--muted:#6b7688;--border:#dfe3ea}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--navy)}
  .card{width:min(420px,calc(100% - 40px));padding:30px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 18px 45px rgba(28,43,74,.12);text-align:center}
  .mark{width:34px;height:34px;margin:0 auto 16px;border-radius:8px;background:var(--red)}
  h1{margin:0 0 8px;font-size:24px}
  p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="card"><div class="mark"></div><h1>Tablero de Indicadores</h1><p id="status">Validando acceso del Portal Nogasa…</p></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://shgnuihnxoahsvrnntfq.supabase.co',
  'sb_publishable_TGNnuqnajrAZ6m2_XyklzA_LqZoVKrS'
);

const statusEl = document.getElementById('status');
const embedded = window.parent !== window;
const allowedOrigins = new Set([
  'https://portal-nogasa.vercel.app',
  'https://portal-nogasa-astridsevillap-star-s.vercel.app'
]);
let completed = false;
let accepting = false;

function openDashboard(){
  if(completed) return;
  completed = true;
  location.replace('/index.html?from=portal');
}

async function acceptPortalSession(event){
  if(event.source !== window.parent) return;
  if(!allowedOrigins.has(event.origin)) return;
  if(!event.data || event.data.type !== 'nogasa-auth-session') return;
  if(accepting || completed) return;

  const accessToken = event.data.accessToken;
  const refreshToken = event.data.refreshToken;
  if(!accessToken || !refreshToken) return;

  accepting = true;
  statusEl.textContent = 'Conectando con tu sesión del portal…';

  const { error } = await supabase.auth.setSession({
    access_token: accessToken,
    refresh_token: refreshToken
  });

  if(error){
    accepting = false;
    statusEl.textContent = 'Reintentando acceso desde el portal…';
    window.parent.postMessage({ type:'nogasa-auth-request' }, event.origin);
    return;
  }

  const { data, error: userError } = await supabase.auth.getUser();
  if(!userError && data.user){
    statusEl.textContent = 'Acceso validado. Abriendo indicadores…';
    openDashboard();
    return;
  }

  accepting = false;
  statusEl.textContent = 'Revalidando tu sesión del portal…';
  window.parent.postMessage({ type:'nogasa-auth-request' }, event.origin);
}

window.addEventListener('message', acceptPortalSession);

if(embedded){
  // Dentro del Portal siempre prevalece la sesión actual del Portal.
  // No confiamos en sesiones locales anteriores del tablero, porque pueden
  // estar vencidas o pertenecer a un acceso independiente previo.
  window.parent.postMessage({ type:'nogasa-auth-request' }, '*');

  setTimeout(() => {
    if(!completed && !accepting){
      statusEl.textContent = 'Esperando la sesión del Portal Nogasa…';
      window.parent.postMessage({ type:'nogasa-auth-request' }, '*');
    }
  }, 1800);

  setTimeout(() => {
    if(!completed && !accepting){
      statusEl.textContent = 'No se recibió la sesión del portal. Actualiza el Portal Nogasa e inténtalo nuevamente.';
    }
  }, 6500);
} else {
  // Acceso directo: mantiene el login propio existente del tablero.
  openDashboard();
}
</script>
</body>
</html>
