<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semáforo de Indicadores</title>
<style>
  :root{
    --navy:#1c2b4a;
    --red:#c0392b;
    --blue:#1f5fa8;
    --green:#1e8f4e;
    --green-bg:#e6f6ec;
    --amber:#c8940a;
    --amber-bg:#fbf1da;
    --red2:#c0392b;
    --red-bg:#fbe7e6;
    --gray:#5b6b82;
    --gray-bg:#eceff3;
    --border:#dfe3ea;
    --text:#22303f;
    --muted:#6b7688;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background:#f6f7f9;
    color:var(--text);
    padding:28px 20px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  .auth-gate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#1c2b4a,#263b64);}
  .auth-card{width:min(420px,100%);background:#fff;border-radius:14px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.28);}
  .auth-card h2{margin:0 0 8px;font-size:25px;color:var(--navy);}
  .auth-card p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.5;}
  .auth-field{display:block;margin-bottom:14px;font-size:12px;font-weight:700;color:var(--navy);}
  .auth-field input{display:block;width:100%;margin-top:7px;padding:12px 13px;border:1px solid var(--border);border-radius:7px;font:inherit;}
  .auth-submit{width:100%;padding:12px;border:0;border-radius:7px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;}
  .auth-submit:disabled{opacity:.65;cursor:wait;}
  .auth-error{display:none;margin-top:13px!important;color:var(--red)!important;font-size:13px!important;}
  .eyebrow{
    color:var(--red);
    font-weight:800;
    letter-spacing:.06em;
    font-size:13px;
    text-transform:uppercase;
    margin:0 0 4px;
  }
  .eyebrow[contenteditable]:focus, h1[contenteditable]:focus, .sub[contenteditable]:focus{
    outline:2px dashed #b9c2d0; outline-offset:3px; border-radius:4px;
  }
  h1{
    font-size:30px;
    margin:0 0 18px;
    font-weight:800;
  }
  h1 .accent{color:var(--blue);}
  hr{border:none;border-top:1px solid var(--border); margin:0 0 20px;}

  .cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:16px;
  }
  .card{
    border-radius:8px;
    padding:16px 18px;
    color:#fff;
  }
  .card .label{
    font-style:italic;
    font-weight:700;
    font-size:13px;
    opacity:.95;
    margin-bottom:14px;
  }
  .card .num{font-size:34px;font-weight:800;}
  .card .num sub{font-size:16px;font-weight:600;opacity:.85;}
  .card.cumple{background:var(--green);}
  .card.desarrollo{background:var(--amber);}
  .card.no-logrado{background:var(--red2);}
  .card.pendiente{background:var(--gray);}

  .summary{
    font-size:14px;
    margin:0 0 18px;
    color:var(--text);
  }
  .summary b{font-weight:800;}
  .summary[contenteditable]:focus{outline:2px dashed #b9c2d0;outline-offset:3px;border-radius:4px;}

  table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 0 0 1px var(--border);
  }
  thead th{
    background:var(--navy);
    color:#fff;
    text-align:left;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:12px 14px;
    font-weight:700;
  }
  thead th.center, td.center{text-align:center;}
  tbody tr:nth-child(odd){background:#fafbfc;}
  tbody td{
    padding:10px 14px;
    font-size:14px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}
  td[contenteditable]{cursor:text;}
  td[contenteditable]:hover{background:#f0f4f9;}
  td[contenteditable]:focus{
    outline:2px solid #9db6d8; outline-offset:-2px; background:#fff;
  }
  .indicador{font-weight:700; font-style:italic;}
  .logro{font-weight:800;}
  .meta{font-style:italic;color:var(--muted);}
  select.estado{
    width:100%;
    border:none;
    background:transparent;
    font-weight:800;
    font-size:13px;
    padding:6px 8px;
    border-radius:6px;
    cursor:pointer;
  }
  select.estado:focus{outline:2px solid #9db6d8;}
  .estado-cumple{background:var(--green-bg); color:var(--green);}
  .estado-desarrollo{background:var(--amber-bg); color:var(--amber);}
  .estado-no{background:var(--red-bg); color:var(--red2);}
  .estado-pendiente{background:var(--gray-bg); color:var(--gray);}

  .row-actions{width:64px;text-align:center;}
  .row-actions .actions-wrap{display:flex;align-items:center;justify-content:center;gap:2px;}
  .del-btn{
    border:none;background:transparent;color:#c0c6d0;cursor:pointer;
    font-size:16px;line-height:1;padding:4px;border-radius:4px;
  }
  .del-btn:hover{color:var(--red2); background:#fbe7e6;}
  .track-btn{
    border:none;background:transparent;color:#aab4c4;cursor:pointer;
    font-size:13px;line-height:1;padding:5px 6px;border-radius:4px;font-weight:800;
  }
  .track-btn:hover{background:#eef2f7;color:var(--blue);}
  .track-btn.active{color:var(--blue);}

  td.auto-calc{cursor:default; background:#f5f8fc;}
  .estado-badge{
    display:inline-block;
    width:100%;
    font-weight:800;
    font-size:13px;
    padding:6px 8px;
    border-radius:6px;
    text-align:left;
    cursor:default;
  }

  .tracking-row td{padding:0; background:#f7f9fc;}
  .tracking-panel{padding:14px 18px 16px;}
  .tracking-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:12px; flex-wrap:wrap; gap:8px;
  }
  .tracking-title{font-size:12px; color:var(--muted); font-weight:700;}
  .tracking-grid{display:flex; align-items:center; gap:14px; margin-bottom:12px; flex-wrap:wrap;}
  .tracking-meta{font-size:13px; font-weight:800; display:flex; align-items:center; gap:4px;}
  .tracking-meta label{font-weight:700; color:var(--muted); font-size:11px; text-transform:uppercase;}
  .tracking-meta input{
    width:50px; text-align:center; border:1px solid var(--border);
    border-radius:4px; padding:4px; font-weight:800; font-size:13px;
  }
  .tracking-bands{display:flex; gap:6px; flex-wrap:wrap;}
  .band{
    padding:6px 10px; border-radius:6px; font-size:12px; font-weight:800;
    display:flex; align-items:center; gap:2px;
  }
  .band input{
    width:34px; border:none; background:rgba(255,255,255,.65);
    border-radius:4px; text-align:center; font-weight:800; padding:3px 2px; font-size:12px;
  }
  .band-no{background:var(--red-bg); color:var(--red2);}
  .band-desarrollo{background:#fbf6d0; color:#8a6608;}
  .band-cumple{background:#e6f2da; color:#4c7a26;}
  .tracking-months{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(58px,1fr)); gap:6px;
  }
  .month-cell{
    background:#fff; border:1px solid var(--border); border-radius:6px;
    padding:6px 4px; text-align:center;
  }
  .month-cell label{
    display:block; font-size:10px; color:var(--muted); font-weight:800;
    text-transform:uppercase; margin-bottom:3px;
  }
  .month-cell input{
    width:100%; border:none; text-align:center; font-weight:800;
    font-size:13px; padding:2px 0; background:transparent;
  }
  .month-cell.is-latest{border-color:var(--blue); box-shadow:0 0 0 1px var(--blue);}

  .mode-select{
    border:1px solid var(--border); border-radius:4px; padding:5px 6px;
    font-weight:700; font-size:12px; color:var(--text); background:#fff;
  }

  .tracking-quarters{display:flex; flex-direction:column; gap:10px;}
  .quarter-block{
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:#fff;
  }
  .quarter-block.quarter-active{border-color:var(--blue); box-shadow:0 0 0 1px var(--blue);}
  .quarter-head{font-size:12px; font-weight:800; color:var(--muted); margin-bottom:6px;}
  .quarter-block.quarter-active .quarter-head{color:var(--blue);}

  .tracking-semesters{display:flex; gap:12px; flex-wrap:wrap;}
  .semester-cell{
    flex:1; min-width:120px; background:#fff; border:1px solid var(--border);
    border-radius:8px; padding:10px; text-align:center;
  }
  .semester-cell label{
    display:block; font-size:11px; color:var(--muted); font-weight:800;
    text-transform:uppercase; margin-bottom:6px;
  }
  .semester-cell input{
    width:100%; border:none; text-align:center; font-weight:800;
    font-size:18px; background:transparent;
  }

  .tracking-exact{
    background:#fff; border:1px solid var(--border); border-radius:8px;
    padding:10px 14px; display:inline-flex; align-items:center; gap:8px;
  }
  .tracking-exact label{font-size:11px; color:var(--muted); font-weight:800; text-transform:uppercase;}
  .tracking-exact input{
    width:80px; border:1px solid var(--border); border-radius:4px;
    text-align:center; font-weight:800; font-size:15px; padding:5px;
  }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:16px;
    gap:10px;
    flex-wrap:wrap;
  }
  .btn{
    border:1px solid var(--border);
    background:#fff;
    padding:8px 14px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:var(--text);
  }
  .btn:hover{background:#f0f2f5;}
  .btn.primary{background:var(--blue); color:#fff; border-color:var(--blue);}
  .btn.primary:hover{background:#184c87;}
  .btn.danger{color:var(--red2); border-color:#f0c7c3;}
  .btn.danger:hover{background:var(--red-bg);}
  .status{
    font-size:12px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#2ecc71;display:inline-block;}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;}

  .profile-gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:#f6f7f9;
  }
  .profile-card{
    max-width:520px; width:100%; background:#fff; border-radius:12px;
    border:1px solid var(--border); padding:32px; text-align:center;
  }
  .profile-eyebrow{
    color:var(--red); font-weight:800; letter-spacing:.06em; font-size:12px;
    text-transform:uppercase; margin:0 0 8px;
  }
  .profile-card h2{font-size:22px; margin:0 0 8px; font-weight:800;}
  .profile-sub{font-size:13px; color:var(--muted); margin:0 0 22px; line-height:1.5;}
  .profile-options{display:flex; flex-direction:column; gap:8px;}
  .profile-option-btn{
    border:1px solid var(--border); background:#fff; border-radius:8px;
    padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer;
    color:var(--text); text-align:left;
  }
  .profile-option-btn:hover{background:#f0f4f9; border-color:var(--blue);}
  .profile-option-btn.is-admin{border-color:var(--navy); color:var(--navy); background:#eef1f6;}

  .profile-bar{
    display:flex; justify-content:flex-end; align-items:center; gap:8px;
    margin-bottom:8px; font-size:12px; color:var(--muted);
  }
  .link-btn{
    border:none; background:transparent; color:var(--blue); font-size:12px;
    font-weight:700; cursor:pointer; padding:2px 4px;
  }
  .link-btn:hover{text-decoration:underline;}
  th.area-col, td.area-col{white-space:nowrap;}
</style>
