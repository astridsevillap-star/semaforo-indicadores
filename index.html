<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indicadores Nogasa</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    #loader{position:fixed;inset:0;display:grid;place-items:center;color:#1c2b4a;font-weight:700;background:#f6f7f9;z-index:2}
    #board{display:none;width:100%;height:100%;border:0;background:#f6f7f9}
    #board.ready{display:block}
  </style>
</head>
<body>
  <div id="loader">Cargando Indicadores…</div>
  <iframe id="board" title="Indicadores Nogasa"></iframe>

  <script>
    const STORAGE_ENDPOINT = 'https://shgnuihnxoahsvrnntfq.supabase.co/functions/v1/indicadores-storage';
    const EDIT_KEY_LOCAL = 'nogasa-indicadores-edit-key';
    const BOARD_URL = '/semaforo_indicadores%20(3)%20(1).html';

    function askEditKey(message){
      const key = window.prompt(message || 'Ingresa la clave de edición para guardar cambios:');
      if(!key) throw new Error('Edición cancelada');
      localStorage.setItem(EDIT_KEY_LOCAL, key.trim());
      return key.trim();
    }

    async function sharedGet(key){
      const response = await fetch(STORAGE_ENDPOINT + '?key=' + encodeURIComponent(key), { cache:'no-store' });
      if(!response.ok) throw new Error('No se pudo leer el guardado compartido (' + response.status + ')');
      return await response.json();
    }

    async function sharedSet(key, value){
      let editKey = localStorage.getItem(EDIT_KEY_LOCAL) || '';
      if(!editKey) editKey = askEditKey();

      for(let attempt = 0; attempt < 2; attempt++){
        const response = await fetch(STORAGE_ENDPOINT, {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body:JSON.stringify({ key, value, editKey })
        });

        if(response.ok) return { ok:true };

        if(response.status === 401 && attempt === 0){
          localStorage.removeItem(EDIT_KEY_LOCAL);
          editKey = askEditKey('La clave no es correcta. Ingresa nuevamente la clave de edición:');
          continue;
        }

        let detail = '';
        try{ detail = (await response.json()).error || ''; }catch(e){}
        throw new Error(detail || ('No se pudo guardar (' + response.status + ')'));
      }
    }

    window.__nogasaStorageRpc = async function(action, key, value, shared){
      if(!shared){
        const localKey = 'nogasa-local:' + key;
        if(action === 'get'){
          const stored = localStorage.getItem(localKey);
          return stored === null ? null : { value: stored };
        }
        if(action === 'set'){
          localStorage.setItem(localKey, String(value));
          return { ok:true };
        }
        throw new Error('Operación de almacenamiento no soportada');
      }

      if(action === 'get') return await sharedGet(key);
      if(action === 'set') return await sharedSet(key, String(value));
      throw new Error('Operación de almacenamiento no soportada');
    };

    function installAdminControls(frame){
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      if(!doc || !doc.body) return;

      const adminOption = doc.querySelector('.profile-option-btn.is-admin');
      if(adminOption) adminOption.textContent = 'Modo edición — Administrador';

      if(!doc.getElementById('nogasa-admin-save-style')){
        const style = doc.createElement('style');
        style.id = 'nogasa-admin-save-style';
        style.textContent = `
          #nogasa-cloud-save{position:fixed;right:18px;bottom:18px;z-index:99999;display:none;align-items:center;gap:8px;background:#fff;border:1px solid #dfe3ea;border-radius:10px;padding:8px 10px;box-shadow:0 10px 28px rgba(28,43,74,.18)}
          #nogasa-cloud-save button{border:0;border-radius:7px;background:#1f5fa8;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}
          #nogasa-cloud-save button:disabled{opacity:.6;cursor:wait}
          #nogasa-cloud-save span{font-size:12px;color:#6b7688;font-weight:700}
        `;
        doc.head.appendChild(style);
      }

      let controls = doc.getElementById('nogasa-cloud-save');
      if(!controls){
        controls = doc.createElement('div');
        controls.id = 'nogasa-cloud-save';

        const btn = doc.createElement('button');
        btn.id = 'nogasa-save-now';
        btn.type = 'button';
        btn.textContent = 'Guardar cambios';

        const state = doc.createElement('span');
        state.id = 'nogasa-save-state';
        state.textContent = 'Guardado compartido';

        controls.appendChild(btn);
        controls.appendChild(state);
        doc.body.appendChild(controls);

        btn.addEventListener('click', async function(){
          btn.disabled = true;
          state.textContent = 'Guardando…';
          try{
            if(typeof win.persist !== 'function') throw new Error('El tablero todavía no terminó de cargar');
            await win.persist();
            state.textContent = 'Guardado';
            setTimeout(function(){ state.textContent = 'Guardado compartido'; }, 1800);
          }catch(error){
            console.error(error);
            state.textContent = 'No se pudo guardar';
          }finally{
            btn.disabled = false;
          }
        });
      }

      function refreshAdminMode(){
        const label = doc.getElementById('profile-current-label');
        const dashboard = doc.getElementById('dashboard-wrap');
        const adminActive = !!label && /Administrador/i.test(label.textContent || '') && (!dashboard || dashboard.style.display !== 'none');
        controls.style.display = adminActive ? 'flex' : 'none';
      }

      doc.addEventListener('click', function(){ setTimeout(refreshAdminMode, 0); }, true);

      const label = doc.getElementById('profile-current-label');
      if(label){
        new MutationObserver(refreshAdminMode).observe(label, {childList:true,subtree:true,characterData:true});
      }

      refreshAdminMode();
      setTimeout(refreshAdminMode, 250);
    }

    async function boot(){
      const loader = document.getElementById('loader');
      const frame = document.getElementById('board');
      try{
        const response = await fetch(BOARD_URL + '?v=' + Date.now(), { cache:'no-store' });
        if(!response.ok) throw new Error('No se pudo cargar el tablero (' + response.status + ')');
        let html = await response.text();

        const storageAdapter = `\n<script>\nwindow.storage = {\n  get: function(key, shared){ return parent.__nogasaStorageRpc('get', key, null, !!shared); },\n  set: function(key, value, shared){ return parent.__nogasaStorageRpc('set', key, value, !!shared); }\n};\n<\/script>\n`;

        html = html.replace('<head>', '<head>\n<base href="/">' + storageAdapter);

        frame.addEventListener('load', function(){
          loader.style.display = 'none';
          frame.classList.add('ready');
          installAdminControls(frame);
        }, { once:true });

        frame.srcdoc = html;
      }catch(error){
        console.error(error);
        loader.textContent = 'No se pudo cargar Indicadores. Actualiza la página e inténtalo nuevamente.';
      }
    }

    boot();
  </script>
</body>
</html>
